name: Scheduled Naukri Profile Refresh

on:
  schedule:
    # 8:30 AM, 10:00 AM, 11:30 AM, 1:00 PM, 2:30 PM, 4:00 PM, 5:30 PM IST (UTC+5:30) - Monday to Friday only (45-min alternating with Account 2)
    - cron: '0 3 * * 1-5'   # 08:30 AM IST, Mon-Fri
    - cron: '30 4 * * 1-5'  # 10:00 AM IST, Mon-Fri
    - cron: '0 6 * * 1-5'   # 11:30 AM IST, Mon-Fri
    - cron: '30 7 * * 1-5'  # 01:00 PM IST, Mon-Fri
    - cron: '0 9 * * 1-5'   # 02:30 PM IST, Mon-Fri
    - cron: '30 10 * * 1-5' # 04:00 PM IST, Mon-Fri
    - cron: '0 12 * * 1-5'  # 05:30 PM IST, Mon-Fri
  workflow_dispatch: # Allows manual trigger from GitHub web UI

concurrency:
  group: naukri-refresh
  cancel-in-progress: true

jobs:
  refresh:
    name: Scheduled Naukri Profile Refresher
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install
          npx --yes playwright-core install --with-deps chromium

      - name: Run Profile Refresh (1 Cycle - Headline Only)
        env:
          NAUKRI_SESSION_B64: ${{ secrets.NAUKRI_SESSION_B64 }}
          SKIP_CV_UPLOAD: "true"
          CI: true
          REFRESH_CYCLES: 1
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x900x24" node naukri-profile-refresh.js

      - name: Upload Screenshot on Failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshot
          path: "*.png"
          if-no-files-found: ignore
