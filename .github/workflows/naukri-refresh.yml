name: Scheduled Naukri Profile Refresh

on:
  schedule:
    # Fallback watchdog (if 24/7 cloud relay is active, it exits in 2s; if dead, it revives)
    - cron: '15 3,5,7,9,11 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub web UI / chaining
    inputs:
      mode:
        description: 'Run mode: session (full scheduled day) or single (1 immediate cycle)'
        required: false
        default: 'session'

concurrency:
  group: naukri-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Scheduled Naukri Profile Refresher
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install
          npx --yes playwright-core install --with-deps chromium

      - name: Run Cloud Profile Refresh Session
        env:
          NAUKRI_SESSION_B64: ${{ secrets.NAUKRI_SESSION_B64 }}
          SKIP_CV_UPLOAD: "true"
          CI: true
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SCHEDULE_SLOTS: "08:30,09:15,10:00,10:45,11:30,12:15,13:00,13:45,14:30,15:15,16:00,16:45,17:30,18:15"
          SINGLE_RUN: ${{ inputs.mode == 'single' }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x900x24" node run-cloud-schedule.js

      - name: Upload Screenshot on Failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshot
          path: "*.png"
          if-no-files-found: ignore
